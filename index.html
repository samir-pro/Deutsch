<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c8102e" />
  <meta name="description" content="Auf Deutsch! Learn German from A0 (zero) to C2 — everyday German, real grammar and the admin of living and studying in Germany, right in your browser." />
  <title>Auf Deutsch! · Learn German A0–C2</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply the saved theme before paint to avoid a flash of the wrong colours.
    (function () {
      try {
        var t = localStorage.getItem("aufdeutsch.theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Screens are rendered here by js/app.js -->
    <div class="boot">Einen Moment… 🇩🇪</div>
  </div>

  <!-- Toast / feedback layer -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <noscript><p style="text-align:center">Auf Deutsch! needs JavaScript to run.</p></noscript>

  <script src="js/content/course.js"></script>
  <script src="js/content/a0.js"></script>
  <script src="js/content/a1.js"></script>
  <script src="js/content/a2.js"></script>
  <script src="js/content/b1.js"></script>
  <script src="js/content/b2.js"></script>
  <script src="js/content/c1.js"></script>
  <script src="js/content/c2.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
